# Dev override: mounts frontend source into the container and runs Vite HMR.
# No image rebuild needed — file changes are reflected instantly.
#
# Usage (via taskforge.sh):
#   ./taskforge.sh dev
#
# Or manually:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  frontend:
    # Skip the built image — run the dev server instead
    image: node:20-alpine
    working_dir: /app
    # Mount source code live into the container
    volumes:
      - ./frontend:/app
      # Keep container's node_modules isolated from host
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_GRAPHQL_URL: http://localhost:4000/graphql
    command: sh -c "npm install --legacy-peer-deps --silent && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  frontend_node_modules:
