services:

  # ── Redis (local) ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Auth Service (Spring Boot — schema: auth) ──────────────────────────────
  auth-service:
    build: ./auth-service
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}?currentSchema=taskforge_auth&sslmode=require"
      SPRING_DATASOURCE_USERNAME: "${PG_USER}"
      SPRING_DATASOURCE_PASSWORD: "${PG_PASSWORD}"
      HIBERNATE_DDL_AUTO: "${HIBERNATE_DDL_AUTO:-update}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/.well-known/jwks.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ── Core Service (Go — schema: core) ──────────────────────────────────────
  core-service:
    build:
      context: ../
      dockerfile: Capstone/core-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      auth-service:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?search_path=core&sslmode=require"
      JWKS_URL: "${JWKS_URL}"
      SEARCH_SERVICE_URL: "${SEARCH_SERVICE_URL}"
      GATEWAY_NOTIFY_URL: "${GATEWAY_NOTIFY_URL}"
      PORT: "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Search Service (Python — schema: search) ───────────────────────────────
  search-service:
    build: ./search-service
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}"
      JWKS_URL: "${JWKS_URL}"
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── Gateway (NestJS) ───────────────────────────────────────────────────────
  gateway:
    build: ./gateway
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL}"
      CORE_SERVICE_URL: "${CORE_SERVICE_URL}"
      SEARCH_SERVICE_URL: "${SEARCH_SERVICE_URL}"
      REDIS_URL: "${REDIS_URL}"
      JWKS_URL: "${JWKS_URL}"
      PORT: "4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    env_file: .env
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: "${NEXT_PUBLIC_GRAPHQL_URL}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL}"
      NEXT_PUBLIC_GATEWAY_URL: "${NEXT_PUBLIC_GATEWAY_URL}"
