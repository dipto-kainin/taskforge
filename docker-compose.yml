services:

  # ── Redis (local) ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # SEC-10: removed host port binding (was "6379:6379").
    # Redis is only reachable from other containers on the internal Docker network.
    # SEC-10: added requirepass to prevent unauthenticated access.
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Auth Service (Spring Boot — schema: auth) ──────────────────────────────
  auth-service:
    build: ./auth-service
    # SEC-10: removed host port binding (was "8080:8080").
    # Auth-service is only reachable via the gateway on the internal network.
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}?currentSchema=taskforge_auth&sslmode=require"
      SPRING_DATASOURCE_USERNAME: "${PG_USER}"
      SPRING_DATASOURCE_PASSWORD: "${PG_PASSWORD}"
      HIBERNATE_DDL_AUTO: "${HIBERNATE_DDL_AUTO:-update}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      # SEC-04: RSA private key loaded from env var — survives restarts on Render.
      RSA_PRIVATE_KEY: "${RSA_PRIVATE_KEY}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/.well-known/jwks.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ── Core Service (Go — schema: core) ──────────────────────────────────────
  core-service:
    build:
      context: ../
      dockerfile: Capstone/core-service/Dockerfile
    # SEC-10: removed host port binding (was "8081:8081").
    # Core-service is only reachable via the gateway on the internal network.
    depends_on:
      auth-service:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?search_path=core&sslmode=require"
      JWKS_URL: "${JWKS_URL}"
      EXTERNAL_SERVICES_URL: "${EXTERNAL_SERVICES_URL}"
      GATEWAY_NOTIFY_URL: "${GATEWAY_NOTIFY_URL}"
      PORT: "8081"
      # SEC-08: pre-shared secret for /internal/notify endpoint authentication
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── External Services Platform (Python — schema: search) ──────────────────────────────────
  external-services:
    build: ./external-services
    # SEC-10: removed host port binding (was "8000:8000").
    # External-services is only reachable via the gateway on the internal network.
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=require"
      JWKS_URL: "${JWKS_URL}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      SECRET_KEY: "${SECRET_KEY}"
      CORE_SERVICE_URL: "http://core-service:8081"
    healthcheck:
      # /health responds immediately — model loads in background
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Gateway (NestJS) ───────────────────────────────────────────────────────
  gateway:
    build: ./gateway
    ports:
      # Gateway is the single public entry point — only this port is exposed on the host.
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL}"
      CORE_SERVICE_URL: "${CORE_SERVICE_URL}"
      EXTERNAL_SERVICES_URL: "${EXTERNAL_SERVICES_URL}"
      REDIS_URL: "${REDIS_URL}"
      JWKS_URL: "${JWKS_URL}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      PORT: "4000"
      # SEC-08: pre-shared secret for /internal/notify endpoint authentication
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ── Frontend ──────────────────────────────────────────────────────────────
  # Deployed on Vercel — not included in Docker Compose.
  # Set VITE_GRAPHQL_URL in Vercel dashboard to point to the gateway service.
