services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge_secret
      POSTGRES_DB: postgres
    volumes:
      - ./infra/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskforge_auth
      SPRING_DATASOURCE_USERNAME: taskforge
      SPRING_DATASOURCE_PASSWORD: taskforge_secret
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/.well-known/jwks.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  core-service:
    build:
      context: ../
      dockerfile: Capstone/core-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://taskforge:taskforge_secret@postgres:5432/taskforge_core?sslmode=disable
      JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      SEARCH_SERVICE_URL: http://search-service:8000
      GATEWAY_NOTIFY_URL: http://gateway:4000/internal/notify
      PORT: "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  search-service:
    build: ./search-service
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://taskforge:taskforge_secret@postgres:5432/taskforge_search
      JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  gateway:
    build: ./gateway
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      CORE_SERVICE_URL: http://core-service:8081
      SEARCH_SERVICE_URL: http://search-service:8000
      REDIS_URL: redis://redis:6379
      JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      PORT: "4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/graphql
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000

volumes:
  pgdata:
