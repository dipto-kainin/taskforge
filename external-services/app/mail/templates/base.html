<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>{% block title %}Block Work{% endblock %}</title>

  <style>
    @media only screen and (max-width: 640px) {

      .email-page {
        padding: 16px 10px !important;
      }

      .email-card {
        box-shadow: 5px 5px 0 #171717 !important;
      }

      .header {
        padding: 20px 22px !important;
      }

      .body {
        padding: 30px 22px !important;
      }

      .footer {
        padding: 20px 22px !important;
      }

      .invite-title {
        font-size: 30px !important;
      }
    }
  </style>
</head>

<body style="
    margin:0;
    padding:0;
    width:100%;
    background-color:#f7f3e8;
    color:#171717;
    font-family:Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
  ">

  <!-- ============================================================
     PAGE CONTAINER
     ============================================================ -->

  <div class="email-page" style="
    width:100%;
    min-height:100vh;
    background-color:#f7f3e8;
    padding:48px 16px;
    box-sizing:border-box;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  ">

    <!-- ======================================================
       OUTER CARD
       ====================================================== -->

    <div class="email-card" style="
      width:100%;
      max-width:620px;
      margin:0 auto;
      background-color:#ffffff;
      border:3px solid #171717;
      border-radius:14px;
      box-shadow:8px 8px 0 #171717;
      overflow:hidden;
      box-sizing:border-box;
    ">

      <!-- ============================================================
         HEADER — BLOCK WORK BRAND
         ============================================================ -->

      <div class="header" style="
        background-color:#f7f3e8;
        padding:22px 34px;
        border-bottom:3px solid #171717;
        display:flex;
        align-items:center;
      ">
        <img src="https://ik.imagekit.io/diptodeepbiswas/logo.png?updatedAt=1787430105013" alt="Block Work logo" style="
          height:38px;
          width:auto;
          display:block;
          margin-right:14px;
        ">
        <span style="
          color:#171717;
          font-family:Arial Black,Arial,Helvetica,sans-serif;
          font-size:21px;
          font-weight:900;
          letter-spacing:-0.8px;
          text-transform:uppercase;
          line-height:38px;
          display:inline-block;
          vertical-align:middle;
          white-space:nowrap;
        ">
          BLOCK WORK
        </span>
      </div>

      <!-- ====================================================
         BODY
         ==================================================== -->

      <div class="body" style="
        background-color:#ffffff;
        padding:42px 40px 40px;
      ">
        {% block content %}{% endblock %}
      </div>

      <!-- ====================================================
         FOOTER
         ==================================================== -->

      <div class="footer" style="
        background-color:#f7f3e8;
        border-top:3px solid #171717;
        padding:24px 32px;
        text-align:center;
      ">
        <p style="
          margin:0;
          color:#57534e;
          font-family:Arial,Helvetica,sans-serif;
          font-size:11px;
          line-height:1.65;
        ">
          <strong style="
            color:#171717;
            font-weight:900;
          ">
            BLOCK WORK
          </strong>
          &nbsp;—&nbsp; Build work. Ship work.
          <br>
          If you didn't expect this email,
          you can safely ignore it.
          <br><br>
          &copy; 2026 Block Work. All rights reserved.
        </p>
      </div>

    </div>

  </div>

</body>

</html>
