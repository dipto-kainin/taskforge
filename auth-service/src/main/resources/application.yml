logging:
  level:
    org.springframework.security: INFO

spring:
  application:
    name: auth-service

  jmx:
    enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=taskforge_auth&sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3       # Supabase free tier connection limit
      minimum-idle: 0            # Lazy connection initialization to speed up boot
      connection-timeout: 20000  # 20s connection timeout
      idle-timeout: 300000       # 5 min idle timeout
      max-lifetime: 1200000      # 20 min max lifetime
      keepalive-time: 30000      # 30s TCP keepalive to prevent firewall/Supabase drop

  # Run schema.sql only when SPRING_SQL_INIT_MODE=always is set (i.e. during ./taskforge.sh migrate auth)
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

  jpa:
    open-in-view: false
    hibernate:
      # none = skip schema validation during normal boot to save startup time; use 'update' via ./taskforge.sh migrate auth
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: taskforge_auth
        boot:
          allow_jdbc_metadata: false

server:
  port: 8080

jwt:
  access-token-expiry-ms: 900000       # 15 minutes
  refresh-token-expiry-ms: 604800000   # 7 days
