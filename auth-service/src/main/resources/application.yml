logging:
  level:
    org.springframework.security: TRACE

spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=taskforge_auth&sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3       # Supabase free tier session mode limit is 15 total
      minimum-idle: 1            # Don't hold idle connections open
      connection-timeout: 30000  # 30s before giving up on a connection
      idle-timeout: 600000       # Release idle connections after 10 min

  # Run schema.sql before Hibernate DDL to ensure 'taskforge_auth' schema exists
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: taskforge_auth

server:
  port: 8080

jwt:
  access-token-expiry-ms: 900000       # 15 minutes
  refresh-token-expiry-ms: 604800000   # 7 days
